[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dokutipp"
version = "1.3.0"
description = "Select and render German public-media documentary recommendations."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Artur Borger" }]
dependencies = []

[project.scripts]
dokutipp = "dokutipp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
